# Server
server:
  port: 8080

# Spring
spring:
  application:
    name: SpringStoreApi
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:w}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        ddl-auto:
          auto: update
        show_sql: true
  config:
    import: optional:file:.env[.properties]

logging:
  level:
    com.marsmars.services: DEBUG